<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reset Password - सृजन फिर से</title>

<link rel="stylesheet" href="style.css">

<style>

    .auth-container {
        max-width: 450px;
        margin: 100px auto;
        padding: 30px;
    }

    .auth-container h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .auth-form input {
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    .auth-form button {
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: #222;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .auth-form button:hover {
        background: #444;
    }

    .auth-form button:disabled {
        background: #999;
    }

    #message {
        text-align: center;
        margin-top: 20px;
    }

    .success {
        color: green;
    }

    .error {
        color: #b00020;
    }

</style>
