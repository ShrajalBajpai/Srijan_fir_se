<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Write a Poem - सृजन फिर से</title>

<link rel="stylesheet" href="style.css">

<style>

    .write-container {
        max-width: 800px;
        margin: 70px auto;
        padding: 20px;
    }

    .write-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .write-form {
        background: #f8f3ee;
        border: 1px solid #e5d8cc;
        border-radius: 15px;
        padding: 30px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #d8c8ba;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        background: white;
    }

    .form-group textarea {
        min-height: 350px;
        resize: vertical;
        line-height: 1.8;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        outline: none;
        border-color: #8b5e3c;
    }

    .button-container {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .write-button {
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #8b5e3c;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .write-button:hover {
        background: #6f472d;
    }

    .draft-button {
        background: #555;
    }

    .draft-button:hover {
        background: #333;
    }

    #message {
        text-align: center;
        margin-top: 20px;
        font-weight: 600;
    }

    .success {
        color: green;
    }

    .error {
        color: #b00020;
    }

</style>

</head> <body> <header class="navbar">
<div class="brand">

    <img
        src="images/logo.jpg"
        alt="सृजन फिर से Logo"
    >

    <span>सृजन फिर से</span>

</div>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="dashboard.html">
        Dashboard
    </a>

</nav>

</header> <main class="write-container">
<div class="write-header">

    <p class="small-text">
        CREATE SOMETHING BEAUTIFUL
    </p>

    <h1>
        Write Your Poem
    </h1>

    <p>
        Share your thoughts, emotions and words with the world.
    </p>

</div>



<form id="poemForm" class="write-form">


    <div class="form-group">

        <label for="title">
            Poem Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="Enter your poem title"
            required
        >

    </div>



    <div class="form-group">

        <label for="category">
            Category
        </label>

        <select id="category">

            <option value="Poetry">
                Poetry
            </option>

            <option value="Love">
                Love
            </option>

            <option value="Life">
                Life
            </option>

            <option value="Nature">
                Nature
            </option>

            <option value="Sad">
                Sad
            </option>

            <option value="Motivation">
                Motivation
            </option>

            <option value="Spiritual">
                Spiritual
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>



    <div class="form-group">

        <label for="content">
            Your Poem
        </label>

        <textarea
            id="content"
            placeholder="Write your poem here..."
            required
        ></textarea>

    </div>



    <div class="button-container">

        <button
            type="button"
            id="draftButton"
            class="write-button draft-button"
        >
            Save Draft
        </button>


        <button
            type="submit"
            class="write-button"
        >
            Publish Poem
        </button>

    </div>



    <div id="message"></div>


</form>

</main> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <script src="write.js"></script> </body> </html>
