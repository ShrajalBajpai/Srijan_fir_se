<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Work</title>
</head>
<body>

  <h1>Create New Work</h1>

  <form id="workForm">
    <label>Title</label>
    <input
      type="text"
      id="title"
      placeholder="Enter your title"
      required
    >

    <label>Content</label>
    <textarea
      id="content"
      placeholder="Write your content here..."
      rows="15"
    ></textarea>

    <button type="submit">Save Draft</button>
    <button type="button" id="publishBtn">Publish</button>
  </form>

  <p id="message"></p>

  <script type="module" src="js/works.js"></script>
</body>
</html>
