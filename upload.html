<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Upload Writing - सृजन फिर से</title>

<link rel="stylesheet" href="style.css">

<style>

    .upload-container {
        max-width: 700px;
        margin: 70px auto;
        padding: 20px;
    }

    .upload-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .upload-form {
        background: #f8f3ee;
        border: 1px solid #e5d8cc;
        border-radius: 15px;
        padding: 30px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #d8c8ba;
        border-radius: 8px;
        font-size: 16px;
        background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #8b5e3c;
    }

    .upload-button {
        display: block;
        margin: 10px auto 0;
        padding: 12px 28px;
        border: none;
        border-radius: 25px;
        background: #8b5e3c;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .upload-button:hover {
        background: #6f472d;
    }

    .upload-button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    #message {
        text-align: center;
        margin-top: 20px;
        font-weight: 600;
    }

    .success {
        color: green;
    }

    .error {
        color: #b00020;
    }

    .file-info {
        margin-top: 8px;
        color: #777;
        font-size: 13px;
    }

</style>

</head> <body> <header class="navbar">
<div class="brand">

    <img
        src="images/logo.jpg"
        alt="सृजन फिर से Logo"
    >

    <span>सृजन फिर से</span>

</div>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="dashboard.html">
        Dashboard
    </a>

</nav>

</header> <main class="upload-container">
<div class="upload-header">

    <p class="small-text">
        SHARE YOUR WRITING
    </p>

    <h1>
        Upload Your Writing
    </h1>

    <p>
        Upload your poem, story, article or other writing.
    </p>

</div>



<form
    id="uploadForm"
    class="upload-form"
>


    <div class="form-group">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            placeholder="Enter the title"
            required
        >

    </div>



    <div class="form-group">

        <label for="category">
            Category
        </label>

        <select id="category">

            <option value="Poetry">
                Poetry
            </option>

            <option value="Story">
                Story
            </option>

            <option value="Article">
                Article
            </option>

            <option value="Love">
                Love
            </option>

            <option value="Life">
                Life
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>



    <div class="form-group">

        <label for="writingFile">
            Choose File
        </label>

        <input
            type="file"
            id="writingFile"
            accept=".pdf,.doc,.docx"
            required
        >

        <p class="file-info">
            Accepted formats: PDF, DOC, DOCX.
        </p>

    </div>



    <button
        type="submit"
        id="uploadButton"
        class="upload-button"
    >
        Upload Writing
    </button>


    <div id="message"></div>


</form>

</main> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> </script> <script src="upload.js"></script> </body> </html>
