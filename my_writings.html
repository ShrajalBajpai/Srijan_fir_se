<!DOCTYPE html> <html lang="en"> <head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Writings - सृजन फिर से</title>

<link rel="stylesheet" href="style.css">

<style>

    .writings-container {
        max-width: 900px;
        margin: 70px auto;
        padding: 20px;
    }

    .writings-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .writing-card {
        background: #f8f3ee;
        border: 1px solid #e5d8cc;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
    }

    .writing-card h2 {
        margin-top: 0;
        color: #6f472d;
    }

    .writing-meta {
        color: #777;
        font-size: 14px;
        margin-bottom: 15px;
    }

    .writing-preview {
        white-space: pre-line;
        line-height: 1.8;
        color: #444;
        max-height: 120px;
        overflow: hidden;
    }

    .status {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 13px;
        margin-bottom: 15px;
    }

    .published {
        background: #dff3e4;
        color: #26733b;
    }

    .draft {
        background: #fff0d6;
        color: #946200;
    }

    .delete-button {
        margin-top: 20px;
        padding: 9px 18px;
        border: none;
        border-radius: 20px;
        background: #b33a3a;
        color: white;
        cursor: pointer;
    }

    .delete-button:hover {
        background: #8f2929;
    }

    .write-new {
        display: inline-block;
        margin-top: 10px;
        padding: 11px 22px;
        background: #8b5e3c;
        color: white;
        text-decoration: none;
        border-radius: 25px;
    }

    .write-new:hover {
        background: #6f472d;
    }

    #loading {
        text-align: center;
        color: #777;
    }

    #emptyMessage {
        text-align: center;
        padding: 40px;
        color: #777;
        display: none;
    }

    #errorMessage {
        text-align: center;
        color: #b00020;
    }

</style>

</head> <body> <header class="navbar">
<div class="brand">

    <img
        src="images/logo.jpg"
        alt="My Brand Logo"
    >

    <span>सृजन फिर से</span>

</div>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="dashboard.html">
        Dashboard
    </a>

</nav>

</header> <main class="writings-container">
<div class="writings-header">

    <p class="small-text">
        YOUR CREATIONS
    </p>

    <h1>
        My Writings
    </h1>

    <p>
        All your poems and writings in one place.
    </p>

    <a
        href="write.html"
        class="write-new"
    >
        ✍️ Write New Poem
    </a>

</div>



<p id="loading">
    Loading your writings...
</p>


<p id="errorMessage"></p>


<div id="poemsContainer"></div>


<div id="emptyMessage">

    <h2>
        You haven't written anything yet.
    </h2>

    <p>
        Start writing your first poem!
    </p>

    <a
        href="write.html"
        class="write-new"
    >
        Start Writing
    </a>

</div>

</main> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"> </script> <script src="my_writings.js"></script> </body> </html>
